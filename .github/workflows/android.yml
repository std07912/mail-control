name: Android debug build
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Preserve debug signing key for future updates
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: settlement-debug-signing-v1
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Offline source and database checks
        run: |
          python3 scripts/static_check.py
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Compile, test and build
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug lintDebug 2>&1 | tee build.log
      - name: Compare signing certificate with installed test release
        uses: actions/download-artifact@v4
        with:
          name: settlement-mail-debug-apk
          path: previous-apk
          run-id: 39195154059
          github-token: ${{ github.token }}
      - name: Record update compatibility
        run: |
          SIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$SIGNER" verify --print-certs previous-apk/app-debug.apk > old-signature.txt
          "$SIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk > new-signature.txt
          if diff <(grep 'certificate SHA-256 digest' old-signature.txt) <(grep 'certificate SHA-256 digest' new-signature.txt); then
            echo 'Compatible signing certificate: can update the existing app.' > signing-compatibility.txt
          else
            echo 'Different debug signing certificate: the old app must be uninstalled. Saved local data will be removed. Future builds use a cached stable debug key.' > signing-compatibility.txt
          fi
          cat signing-compatibility.txt
      - name: APK
        uses: actions/upload-artifact@v4
        with:
          name: settlement-mail-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            build.log
            signing-compatibility.txt
            app/build/reports/
          if-no-files-found: ignore
          retention-days: 7

  device-check:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Run PDF, ZIP and UI checks on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          profile: pixel_4
          disable-animations: true
          script: bash scripts/device-check.sh
      - name: Device reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-check
          path: |
            ui-screenshots/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 7

  publish:
    needs: [build, device-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: settlement-mail-debug-apk
          path: dist
      - name: Publish tested APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum dist/app-debug.apk > dist/app-debug.apk.sha256
          gh release create v0.2.1-debug dist/app-debug.apk dist/app-debug.apk.sha256 --target '${{ github.sha }}' --title '정산자료 전송 도우미 v0.2.1 · 발송 간격' --notes '기본 발송 간격 30초, 최소 10초. 기존 저장 설정과 승인 작업의 간격은 유지합니다. 네이버 공식 보장 간격이 아닙니다. 단위 테스트·lint·에뮬레이터 검사를 통과한 APK입니다.' --prerelease
