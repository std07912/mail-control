name: Android debug build
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SETTLEMENT_DEBUG_KEY: ${{ github.workspace }}/.signing/debug.keystore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore explicit debug signing key
        id: signing
        uses: actions/cache/restore@v4
        with:
          path: .signing/debug.keystore
          key: settlement-explicit-debug-signing-v3
      - name: Bootstrap signing key once
        if: steps.signing.outputs.cache-hit != 'true'
        run: |
          if gh release view v0.3.0-debug >/dev/null 2>&1; then
            echo 'Signing key cache missing after publication. Stop rather than silently changing signatures.' >&2
            exit 1
          fi
          mkdir -p .signing
          keytool -genkeypair -keystore "$SETTLEMENT_DEBUG_KEY" -storepass android -keypass android -alias androiddebugkey -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - name: Save signing key before building
        if: steps.signing.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .signing/debug.keystore
          key: settlement-explicit-debug-signing-v3
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Offline source and database checks
        run: |
          python3 scripts/static_check.py
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Compile, test and build
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug lintDebug 2>&1 | tee build.log
      - name: Verify APK signature and record new installation certificate
        run: |
          SIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$SIGNER" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk > new-signature.txt
          test -s new-signature.txt
          mkdir -p previous-apk
          curl --fail --location --retry 3 https://github.com/std07912/mail-control/releases/download/v0.3.0-debug/app-debug.apk -o previous-apk/app-debug.apk
          "$SIGNER" verify --print-certs previous-apk/app-debug.apk > old-signature.txt
          diff <(grep 'certificate SHA-256 digest' old-signature.txt) <(grep 'certificate SHA-256 digest' new-signature.txt)
          echo 'v0.4.0 retains the v0.3.0 certificate. Older v0.2.2 and earlier cannot be updated.' > signing-compatibility.txt
          cat signing-compatibility.txt
      - name: APK
        uses: actions/upload-artifact@v4
        with:
          name: settlement-mail-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            build.log
            signing-compatibility.txt
            new-signature.txt
            app/build/reports/
          if-no-files-found: ignore
          retention-days: 7

  device-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Run PDF, ZIP and UI checks on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          profile: pixel_4
          disable-animations: true
          script: bash scripts/device-check.sh
      - name: Device reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-check
          path: |
            ui-screenshots/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 7

  publish:
    needs: [build, device-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: settlement-mail-debug-apk
          path: dist
      - name: Publish tested APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum dist/app-debug.apk > dist/app-debug.apk.sha256
          gh release create v0.4.0-debug dist/app-debug.apk dist/app-debug.apk.sha256 --target '${{ github.sha }}' --title '정산자료 전송 도우미 v0.4.0 · 소용량 ZIP과 한글 파일명' --notes '독립 ZIP 여러 개 및 표준 분할 ZIP(.z01+.zip) 생성, 실제 크기 검사, 한글 CP949·UTF-8 파일명 미리보기·해제를 추가했습니다. ZIP 미리보기에서 소용량 ZIP 만들기를 선택하세요. 승인된 내부 문서만 압축하며 수신기관의 압축·분할 형식 승인 확인이 필요합니다. 분할 ZIP은 모든 조각을 모아 호환 앱에서 해제해야 합니다. v0.3.0과 서명 일치를 검사합니다. 발송은 전체 목록 검토와 최종 승인 후 진행합니다.' --prerelease

